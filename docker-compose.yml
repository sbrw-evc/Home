services:
  npm-dashboard:
    build: .
    container_name: npm-dashboard
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      TITLE: "Мои сервисы"
      SHOW_DISABLED: "true"   # false — скрывать выключенные хосты
      POLL_SECONDS: "2"       # как часто проверять изменения базы NPM
    volumes:
      # каталог data от Nginx Proxy Manager, только чтение
      - /data/compose/1/data:/npm:ro
