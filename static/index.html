<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мои сервисы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6fed'/><path d='M8 9h7v7H8zM17 9h7v7h-7zM8 18h7v7H8zM17 18h7v7h-7z' fill='white'/></svg>">
<style>
:root{
  --bg:#f3f4f7;--panel:#fff;--card:#fff;--fg:#1b2130;--mut:#6b7385;--bd:#e3e6ec;
  --acc:#2f6fed;--acc-soft:rgba(47,111,237,.1);--ok:#1f9d55;--warn:#c27c0e;--off:#c0392b;
  --shadow:0 8px 24px rgba(20,30,60,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218;--panel:#151a22;--card:#1a2029;--fg:#e6e9ef;--mut:#8c95a6;--bd:#272e3a;
  --acc:#6b9bff;--acc-soft:rgba(107,155,255,.12);--shadow:0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex}

/* sidebar */
aside{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px;font-weight:700;font-size:17px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff}
nav{flex:1;overflow:auto;padding:4px 10px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;margin-bottom:2px;font-size:14px;word-break:break-all;gap:8px}
nav a:hover{background:var(--acc-soft)}
nav a.active{background:var(--acc);color:#fff}
nav a .cnt{font-size:12px;opacity:.7;flex:none}
.navtitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:14px 10px 6px}
.live{padding:14px 18px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.live.on .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(31,157,85,.6);animation:pulse 2s infinite}
.live.err .dot{background:var(--off)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);padding:16px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.top h1{margin:0;font-size:20px;flex:1;min-width:150px;word-break:break-all}
.burger{display:none;background:none;border:1px solid var(--bd);border-radius:8px;color:var(--fg);padding:6px 10px;font-size:18px;cursor:pointer}
#q{width:280px;max-width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px;outline:none}
#q:focus{border-color:var(--acc)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{background:var(--card);color:var(--mut);border:0;padding:8px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.content{padding:20px 24px 40px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mut)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.grid.list{grid-template-columns:1fr;gap:6px}
.card{position:relative;display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s,opacity .3s;animation:in .35s ease}
.card:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:var(--shadow)}
.card.disabled{opacity:.5}
.card.flash{animation:flash 1.6s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--acc)}}
.head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ico{width:30px;height:30px;border-radius:7px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:contain;background:#fff}
.title{font-weight:600;font-size:16px;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain{color:var(--acc);word-break:break-all;font-size:14px}
.alt{color:var(--mut);font-size:12px;word-break:break-all}
.target{color:var(--mut);font-size:12px;margin-top:6px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.badges{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.b{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--mut)}
.b.ok{color:var(--ok);border-color:currentColor}.b.warn{color:var(--warn);border-color:currentColor}.b.off{color:var(--off);border-color:currentColor}
.grid.list .card{display:grid;grid-template-columns:minmax(160px,1.2fr) 2fr 2fr auto;align-items:center;gap:14px;padding:10px 14px}
.grid.list .head{margin:0}.grid.list .target{margin:0}.grid.list .badges{margin:0}
.grid.list .alt{display:none}
.empty{color:var(--mut);text-align:center;padding:60px 0}
.toast{position:fixed;right:20px;bottom:20px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:none}

@media (max-width:820px){
  aside{position:fixed;left:0;top:0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  body.menu aside{transform:none}
  .burger{display:block}
  .top,.content{padding-left:16px;padding-right:16px}
  #q{width:100%}
  .grid.list .card{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">▦</div><span id="brand">Сервисы</span></div>
  <nav id="nav"></nav>
  <div class="live" id="live"><span class="dot"></span><span id="liveText">подключение…</span></div>
</aside>

<div class="main">
  <div class="top">
    <button class="burger" id="burger" aria-label="Меню">☰</button>
    <h1 id="pageTitle">Все сайты</h1>
    <input id="q" type="search" placeholder="Поиск по домену или адресу…">
    <div class="seg" id="view">
      <button data-v="grid">Плитка</button><button data-v="list">Список</button>
    </div>
  </div>
  <div class="content">
    <div class="stats" id="stats"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const state = { hosts: [], version: null, query: '', view: 'grid' };
try { state.view = localStorage.getItem('view') || 'grid'; } catch {}
const cards = new Map();          // id -> {el, sig}
const colors = ['#2f6fed','#7c3aed','#db2777','#ea580c','#16a34a','#0891b2','#ca8a04','#4f46e5'];
const color = s => colors[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- роутинг: #/ или #/group/<домен>
const route = () => {
  const m = location.hash.match(/^#\/group\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
};

function groups() {
  const g = {};
  state.hosts.forEach(h => (g[h.group] = (g[h.group] || 0) + 1));
  return Object.entries(g).sort((a, b) => a[0].split('.').length - b[0].split('.').length || a[0].localeCompare(b[0]));
}

function renderNav() {
  const cur = route();
  $('#nav').innerHTML =
    `<a href="#/" class="${cur ? '' : 'active'}"><span>Все сайты</span><span class="cnt">${state.hosts.length}</span></a>` +
    `<div class="navtitle">Домены</div>` +
    groups().map(([g, n]) =>
      `<a href="#/group/${encodeURIComponent(g)}" class="${cur === g ? 'active' : ''}"><span>${esc(g)}</span><span class="cnt">${n}</span></a>`
    ).join('');
}

function cardHTML(h) {
  const badges = [
    h.ssl ? '<span class="b ok">HTTPS</span>' : '<span class="b warn">HTTP</span>',
    h.acl ? '<span class="b">ACL</span>' : '',
    h.enabled ? '' : '<span class="b off">выключен</span>',
  ].join('');
  const alt = h.domains.filter(d => d !== h.domain).map(d => `<div class="alt">${esc(d)}</div>`).join('');
  return `<div class="head">
      <div class="ico" style="background:${color(h.name)}">${esc(h.name[0].toUpperCase())}</div>
      <div class="title">${esc(h.name)}</div>
    </div>
    <div><div class="domain">${esc(h.domain)}</div>${alt}</div>
    <div class="target">→ ${esc(h.target)}</div>
    <div class="badges">${badges}</div>`;
}

function addFavicon(el, h) {
  const img = new Image();
  img.onload = () => { if (img.naturalWidth > 1) { const box = el.querySelector('.ico'); box.textContent = ''; box.appendChild(img); } };
  img.src = h.url + '/favicon.ico';
}

// обновляем DOM точечно: карточки переиспользуются, меняются только изменившиеся
function renderCards(changedIds = new Set()) {
  const grid = $('#grid');
  const seen = new Set();
  const sorted = [...state.hosts].sort((a, b) => a.group.localeCompare(b.group) || a.name.localeCompare(b.name));
  sorted.forEach(h => {
    const sig = JSON.stringify(h);
    let c = cards.get(h.id);
    if (!c) {
      const el = document.createElement('a');
      el.target = '_blank'; el.rel = 'noopener';
      c = { el, sig: null };
      cards.set(h.id, c);
    }
    if (c.sig !== sig) {
      const iconChanged = !c.sig || JSON.parse(c.sig).url !== h.url;
      const oldIco = c.el.querySelector('.ico img');
      c.el.innerHTML = cardHTML(h);
      if (!iconChanged && oldIco) { const box = c.el.querySelector('.ico'); box.textContent = ''; box.appendChild(oldIco); }
      else addFavicon(c.el, h);
      c.el.href = h.url;
      c.el.className = 'card' + (h.enabled ? '' : ' disabled');
      c.el.dataset.s = (h.domains.join(' ') + ' ' + h.target).toLowerCase();
      c.el.dataset.g = h.group;
      if (c.sig && changedIds.has(h.id)) { void c.el.offsetWidth; c.el.classList.add('flash'); }
      c.sig = sig;
    }
    grid.appendChild(c.el);   // appendChild переставляет существующий узел в нужный порядок
    seen.add(h.id);
  });
  for (const [id, c] of cards) if (!seen.has(id)) { c.el.remove(); cards.delete(id); }
  applyFilter();
}

function applyFilter() {
  const g = route(), q = state.query.trim().toLowerCase();
  let shown = 0;
  for (const { el } of cards.values()) {
    const ok = (!g || el.dataset.g === g) && (!q || el.dataset.s.includes(q));
    el.style.display = ok ? '' : 'none';
    shown += ok;
  }
  let empty = $('#empty');
  if (!shown) {
    if (!empty) { empty = document.createElement('div'); empty.id = 'empty'; empty.className = 'empty'; }
    empty.textContent = state.hosts.length ? 'Ничего не найдено' : 'Загрузка…';
    $('#grid').appendChild(empty);
  } else if (empty) empty.remove();

  const list = state.hosts.filter(h => !g || h.group === g);
  $('#pageTitle').textContent = g || 'Все сайты';
  $('#stats').innerHTML = [
    [list.length, 'всего'], [list.filter(h => h.enabled).length, 'включено'],
    [list.filter(h => h.ssl).length, 'с HTTPS'], [shown, 'показано'],
  ].map(([n, t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('');
}

function setView(v) {
  state.view = v;
  try { localStorage.setItem('view', v); } catch {}
  $('#grid').classList.toggle('list', v === 'list');
  document.querySelectorAll('#view button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function apply(snap) {
  if (snap.version === state.version) return;
  const prev = new Map(state.hosts.map(h => [h.id, JSON.stringify(h)]));
  const first = state.version === null;
  const changed = new Set(snap.hosts.filter(h => prev.get(h.id) !== JSON.stringify(h)).map(h => h.id));
  const removed = [...prev.keys()].filter(id => !snap.hosts.some(h => h.id === id)).length;
  state.hosts = snap.hosts; state.version = snap.version;
  document.title = snap.title; $('#brand').textContent = snap.title;
  renderNav(); renderCards(changed);
  if (!first && (changed.size || removed)) {
    const added = snap.hosts.filter(h => !prev.has(h.id)).length;
    const parts = [];
    if (added) parts.push(`добавлено: ${added}`);
    if (changed.size - added) parts.push(`изменено: ${changed.size - added}`);
    if (removed) parts.push(`удалено: ${removed}`);
    toast('Список обновлён — ' + parts.join(', '));
  }
}

function setLive(cls, text) {
  $('#live').className = 'live ' + cls;
  $('#liveText').textContent = text;
}

// ---- живые обновления через SSE (с откатом на опрос, если SSE не работает)
function connect() {
  if (!window.EventSource) return poll();
  const es = new EventSource('api/events');
  es.addEventListener('hosts', e => {
    apply(JSON.parse(e.data));
    setLive('on', 'онлайн · ' + new Date().toLocaleTimeString());
  });
  es.addEventListener('failure', e => setLive('err', 'ошибка чтения базы'));
  es.onopen = () => setLive('on', 'онлайн');
  es.onerror = () => setLive('err', 'нет связи, переподключение…');   // EventSource переподключится сам
}
async function poll() {
  try {
    apply(await (await fetch('api/hosts', { cache: 'no-store' })).json());
    setLive('on', 'онлайн · ' + new Date().toLocaleTimeString());
  } catch { setLive('err', 'нет связи'); }
  setTimeout(poll, 5000);
}

$('#q').addEventListener('input', e => { state.query = e.target.value; applyFilter(); });
$('#view').addEventListener('click', e => e.target.dataset.v && setView(e.target.dataset.v));
$('#burger').addEventListener('click', () => document.body.classList.toggle('menu'));
$('#nav').addEventListener('click', () => document.body.classList.remove('menu'));
window.addEventListener('hashchange', () => { renderNav(); applyFilter(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
});

setView(state.view);
applyFilter();
connect();
</script>
</body>
</html>
