name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег, например v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/home

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=home
            org.opencontainers.image.description=Стартовая страница с сайтами из Nginx Proxy Manager
          annotations: |
            org.opencontainers.image.description=Стартовая страница с сайтами из Nginx Proxy Manager

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Prepare assets
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DIR=dist/home-$VERSION
          mkdir -p $DIR
          cp -r docker-compose.yml docker-compose.openbao.yml .env.example README.md openbao $DIR/
          sed -i "s/^HOME_VERSION=.*/HOME_VERSION=$VERSION/" $DIR/.env.example
          # в архиве для развертывания образ берется из GHCR, локальная сборка не нужна
          sed -i '/^    build: \./d' $DIR/docker-compose.yml
          tar -C dist -czf dist/home-$VERSION-deploy.tar.gz home-$VERSION
          ( cd dist && sha256sum home-$VERSION-deploy.tar.gz > SHA256SUMS )

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Home ${{ inputs.tag || github.ref_name }}
          body_path: .github/release-notes/${{ inputs.tag || github.ref_name }}.md
          make_latest: true
          files: |
            dist/home-*-deploy.tar.gz
            dist/SHA256SUMS
